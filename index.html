<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Fight Club</title>
</head>
<body>
<header>
    <h2 class="header__title">Fight Club</h2>
</header>

<main>

    <section class="screen active" id="screenOne">
        <img class="screenOneImg" src="./src/assets/img/imageStart.jpg" alt="Fight">
        <h1>Fight Club</h1>
        <button class="button nextBtn buttonScreenOne">Start Game</button>
    </section>


    <section class="screen" id="screenTwo">
        <h2 class="screenTwo__title">Choose a player</h2>
        <p>Здесь можно описать правила...</p>
        <button class="button nextBtn">Далее</button>
    </section>


    <section class="screen" id="screenThree">
        <h2>Выбор персонажа</h2>
        <p>Тут будет выбор бойца...</p>
        <button class="button nextBtn">Далее</button>
    </section>


    <section class="screen" id="screenFour">
        <h2>Начало боя</h2>
        <p>Описание боя...</p>
        <button class="button nextBtn">Далее</button>
    </section>


    <section class="screen" id="screenFive">
        <h2>Результаты</h2>
        <p>Здесь показываем победителя.</p>
        <button class="button nextBtn">Далее</button>
    </section>


    <section class="screen" id="screenSix">
        <h2>Конец игры</h2>
        <p>Спасибо за игру!</p>
        <button class="button restartBtn">Начать заново</button>
    </section>
</main>

<footer>
    <h3>2025</h3>
</footer>

<script src="./src/js/index.js"></script>
</body>
</html>
